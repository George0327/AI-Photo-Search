spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.security.oauth2.client.registration.google.client-id=60663046324-ufibbpllv6t789nh45vht6g0e007a441.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.security.allowed-domain=bestcj.ro
app.security.frontend-url=http://localhost:5173

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_photo_search_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.drive.application-name=AIPhotoSearch
app.drive.client-id=${spring.security.oauth2.client.registration.google.client-id}
app.drive.client-secret=${GOOGLE_CLIENT_SECRET}
app.drive.refresh-token=${DRIVE_REFRESH_TOKEN}
app.drive.root-folder-id=1ACEsHZQZgfxTy29AQSWQGdtfUNSEW3gI
app.drive.root-folder-name=AIPhotoSearch
app.drive.page-size=1000

app.ai-service.base-url=http://localhost:8000
app.ai-service.internal-api-key=dev-ai-service-key
