spring.application.name=indexing-service
spring.config.import=optional:file:.env[.properties]

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_photo_search_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth-service.url=http://auth-service:8081

app.drive.application-name=AIPhotoSearch
app.drive.client-id=60663046324-ufibbpllv6t789nh45vht6g0e007a441.apps.googleusercontent.com
app.drive.client-secret=${GOOGLE_CLIENT_SECRET}
app.drive.refresh-token=${DRIVE_REFRESH_TOKEN}
app.drive.root-folder-id=1ACEsHZQZgfxTy29AQSWQGdtfUNSEW3gI
app.drive.root-folder-name=AIPhotoSearch
app.drive.page-size=1000

app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:dev-ai-service-key}

app.security.admin-roles=ADMIN,SUPER_ADMIN,OWNER
