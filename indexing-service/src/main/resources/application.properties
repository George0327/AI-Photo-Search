spring.application.name=indexing-service
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n
spring.config.import=optional:file:.env[.properties]

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_photo_search_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Indexing-service owns the albums/media_items/sync_runs schema via Flyway.
# Migrations use IF NOT EXISTS so they apply cleanly both to fresh databases
# and to databases previously created by Hibernate auto-DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth-service.url=http://auth-service:8081

app.drive.application-name=AIPhotoSearch
app.drive.client-id=60663046324-ufibbpllv6t789nh45vht6g0e007a441.apps.googleusercontent.com
app.drive.client-secret=${GOOGLE_CLIENT_SECRET}
app.drive.refresh-token=${DRIVE_REFRESH_TOKEN}
app.drive.root-folder-id=1ACEsHZQZgfxTy29AQSWQGdtfUNSEW3gI
app.drive.root-folder-name=AIPhotoSearch
app.drive.page-size=1000

app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:dev-ai-service-key}

app.security.admin-roles=ADMIN,SUPER_ADMIN,OWNER

# 0 = auto-detect (min(4, logical CPUs)). Each thread keeps a whole image batch
# in memory, so raising this raises peak memory roughly linearly.
app.indexing.pool-size=${INDEXING_POOL_SIZE:0}

# Number of images sent to the AI service per batch request.
app.indexing.batch-size=${INDEXING_BATCH_SIZE:8}
