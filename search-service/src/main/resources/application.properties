spring.application.name=search-service
spring.config.import=optional:file:.env[.properties]

server.port=8083

# Reference-photo uploads for face search (up to 30 photos). Spring's defaults
# (1MB/file, 10MB/request) are far too small for multi-photo uploads.
# max-request-size is kept moderate so a large batch can't OOM this 768MB service.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=150MB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Consumer of media_db: validate only (schema owned by indexing-service via Flyway).
# Reads albums/media_items; writes only its own saved_searches table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth-service.url=http://auth-service:8081

app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:dev-ai-service-key}

# Saved-search history kept per user (oldest pruned beyond this).
app.search.saved-history-limit=${SEARCH_SAVED_HISTORY_LIMIT:20}
