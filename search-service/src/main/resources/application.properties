spring.application.name=search-service
spring.config.import=optional:file:.env[.properties]

server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_photo_search_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth-service.url=http://auth-service:8081

app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:dev-ai-service-key}
