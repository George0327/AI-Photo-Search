spring.application.name=auth-service
spring.config.import=optional:file:.env[.properties]

server.port=8081

spring.security.oauth2.client.registration.google.client-id=60663046324-ufibbpllv6t789nh45vht6g0e007a441.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/login/oauth2/code/google

app.security.allowed-domain=bestcj.ro
app.security.frontend-url=http://localhost
# Email auto-promoted to OWNER on login (bootstraps the first owner). Blank = disabled.
app.security.owner-email=${APP_SECURITY_OWNER_EMAIL:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
