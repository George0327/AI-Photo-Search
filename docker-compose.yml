services:

  # Memory limits are sized for the ~7.4 GB Docker Desktop VM on the dev laptop
  # (Ryzen 6600H, 12 threads, RTX 3050 4GB — CLIP weights live in VRAM).
  # They are ceilings, not reservations; idle services stay far below them.
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes.yml:/etc/traefik/routes.yml:ro
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ai_photo_search_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_photo_search_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_SECURITY_FRONTEND_URL: http://localhost
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  indexing-service:
    build: ./indexing-service
    restart: unless-stopped
    # Indexing shuttles whole image batches through memory; 1g gets OOM-killed.
    mem_limit: 1.5g
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_photo_search_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  search-service:
    build: ./search-service
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_photo_search_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      # search-service only validates the schema, so on a fresh database it must
      # start after indexing-service has run its Flyway migrations.
      indexing-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    # Model weights run on the GPU (VRAM); this covers the Python runtime,
    # CUDA host-side buffers, FAISS indexes and request payloads.
    mem_limit: 3.5g
    env_file: .env
    environment:
      AI_SERVICE_INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_API_KEY}
      HF_HOME: /model-cache/huggingface
      INSIGHTFACE_HOME: /model-cache/insightface
    volumes:
      - ai-indexes:/app/indexes
      - ai-model-cache:/model-cache
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # python:3.11-slim has no wget/curl — use the interpreter itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  ai-indexes:
  ai-model-cache:
