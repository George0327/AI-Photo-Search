services:

  # Memory limits are sized for the ~7.4 GB Docker Desktop VM on the dev laptop
  # (Ryzen 6600H, 12 threads, RTX 3050 4GB — CLIP weights live in VRAM).
  # They are ceilings, not reservations; idle services stay far below them.
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes.yml:/etc/traefik/routes.yml:ro
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # No POSTGRES_DB: the entrypoint's default maintenance DB (postgres) is used
      # only to run the init below, which creates the real bounded-context databases.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      # Runs once on a fresh volume: CREATE DATABASE identity_db / media_db + session schema.
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/00-init.sql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_SECURITY_FRONTEND_URL: http://localhost
      APP_SECURITY_OWNER_EMAIL: george.marinescu@bestcj.ro
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  indexing-service:
    build: ./indexing-service
    restart: unless-stopped
    # Indexing shuttles whole image batches through memory; 1g gets OOM-killed.
    mem_limit: 1.5g
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  search-service:
    build: ./search-service
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: postgres
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      # search-service only validates the schema, so on a fresh database it must
      # start after indexing-service has run its Flyway migrations.
      indexing-service:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    # Model weights run on the GPU (VRAM); this covers the Python runtime,
    # CUDA host-side buffers, FAISS indexes and request payloads.
    mem_limit: 3.5g
    env_file: .env
    environment:
      AI_SERVICE_INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_API_KEY}
      HF_HOME: /model-cache/huggingface
      INSIGHTFACE_HOME: /model-cache/insightface
    volumes:
      - ai-indexes:/app/indexes
      - ai-model-cache:/model-cache
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # python:3.11-slim has no wget/curl — use the interpreter itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - app-net

configs:
  # Postgres init (runs once on a fresh volume). Creates the two bounded-context
  # databases and the Spring Session tables in identity_db (auth-service runs with
  # spring.session.jdbc.initialize-schema=never). media_db is populated by
  # indexing-service's Flyway migrations; identity_db.users by auth Hibernate.
  postgres_init:
    content: |
      CREATE DATABASE identity_db;
      CREATE DATABASE media_db;

      \connect identity_db

      CREATE TABLE SPRING_SESSION (
          PRIMARY_ID CHAR(36) NOT NULL,
          SESSION_ID CHAR(36) NOT NULL,
          CREATION_TIME BIGINT NOT NULL,
          LAST_ACCESS_TIME BIGINT NOT NULL,
          MAX_INACTIVE_INTERVAL INT NOT NULL,
          EXPIRY_TIME BIGINT NOT NULL,
          PRINCIPAL_NAME VARCHAR(100),
          CONSTRAINT SPRING_SESSION_PK PRIMARY KEY (PRIMARY_ID)
      );
      CREATE UNIQUE INDEX SPRING_SESSION_IX1 ON SPRING_SESSION (SESSION_ID);
      CREATE INDEX SPRING_SESSION_IX2 ON SPRING_SESSION (EXPIRY_TIME);
      CREATE INDEX SPRING_SESSION_IX3 ON SPRING_SESSION (PRINCIPAL_NAME);

      CREATE TABLE SPRING_SESSION_ATTRIBUTES (
          SESSION_PRIMARY_ID CHAR(36) NOT NULL,
          ATTRIBUTE_NAME VARCHAR(200) NOT NULL,
          ATTRIBUTE_BYTES BYTEA NOT NULL,
          CONSTRAINT SPRING_SESSION_ATTRIBUTES_PK PRIMARY KEY (SESSION_PRIMARY_ID, ATTRIBUTE_NAME),
          CONSTRAINT SPRING_SESSION_ATTRIBUTES_FK FOREIGN KEY (SESSION_PRIMARY_ID) REFERENCES SPRING_SESSION(PRIMARY_ID) ON DELETE CASCADE
      );

networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  ai-indexes:
  ai-model-cache:
