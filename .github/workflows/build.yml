name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-service:
    name: Build auth-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build
        working-directory: auth-service
        run: chmod +x mvnw && ./mvnw package -DskipTests

  indexing-service:
    name: Build indexing-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build
        working-directory: indexing-service
        run: chmod +x mvnw && ./mvnw package -DskipTests

  search-service:
    name: Build search-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build
        working-directory: search-service
        run: chmod +x mvnw && ./mvnw package -DskipTests

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
